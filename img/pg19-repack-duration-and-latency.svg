<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">REPACK duration and application tail latency</title>
  <desc id="description">Two sequences, each with five cases per mode, on an 8.015 GiB bloated relation. Plain and concurrent operation-duration medians were 15.40 and 53.78 seconds in the first sequence, and 15.76 and 50.61 seconds in the confirmation. Medians of per-case overlap p99 latencies were 14.1705 and 7.0984 seconds, then 14.4629 and 2.0423 seconds. Both modes reclaimed approximately 58.7 percent. The two panels use different horizontal scales.</desc>
  <rect width="1000" height="640" rx="16" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
    <text x="40" y="46" font-size="27" font-weight="700">A shorter rewrite, a longer application stall</text>
    <text x="40" y="77" font-size="17" fill="#475569">Core REPACK on the same 8.015 GiB bloated relation</text>
    <rect x="40" y="100" width="18" height="18" rx="3" fill="#2563eb"/>
    <text x="68" y="115" font-size="16">Plain</text>
    <rect x="150" y="100" width="18" height="18" rx="3" fill="#c65d12"/>
    <text x="178" y="115" font-size="16">Concurrent</text>
    <text x="960" y="115" text-anchor="end" font-size="15" fill="#475569">Lower is better in both panels</text>
    <text x="200" y="156" font-size="20" font-weight="600">Operation duration</text>
    <text x="630" y="156" font-size="20" font-weight="600">Application p99 during overlap</text>
    <text x="200" y="180" font-size="15" fill="#475569">Seconds, median of five cases</text>
    <text x="630" y="180" font-size="15" fill="#475569">Seconds, median of five case-level p99s</text>
    <g stroke="#dbe3ee" stroke-width="1">
      <path d="M200 205V458 M275 205V458 M350 205V458 M425 205V458 M500 205V458"/>
      <path d="M630 205V458 M705 205V458 M780 205V458 M855 205V458 M930 205V458"/>
    </g>
    <path d="M565 143V491" stroke="#cbd5e1" stroke-dasharray="4 5"/>
    <g font-size="15">
      <text x="40" y="215" font-weight="700">First sequence</text>
      <text x="40" y="245">Plain</text>
      <text x="40" y="293">Concurrent</text>
      <text x="40" y="365" font-weight="700">Confirmation</text>
      <text x="40" y="395">Plain</text>
      <text x="40" y="443">Concurrent</text>
    </g>
    <g fill="#2563eb">
      <rect x="200" y="225" width="77" height="30" rx="3"/>
      <rect x="200" y="375" width="78.8" height="30" rx="3"/>
      <rect x="630" y="225" width="265.697" height="30" rx="3"/>
      <rect x="630" y="375" width="271.179" height="30" rx="3"/>
    </g>
    <g fill="#c65d12">
      <rect x="200" y="273" width="268.9" height="30" rx="3"/>
      <rect x="200" y="423" width="253.05" height="30" rx="3"/>
      <rect x="630" y="273" width="133.095" height="30" rx="3"/>
      <rect x="630" y="423" width="38.293" height="30" rx="3"/>
    </g>
    <g font-size="16" font-weight="600">
      <text x="285" y="246">15.40</text>
      <text x="477" y="294">53.78</text>
      <text x="287" y="396">15.76</text>
      <text x="461" y="444">50.61</text>
      <text x="904" y="246">14.17</text>
      <text x="771" y="294">7.10</text>
      <text x="910" y="396">14.46</text>
      <text x="676" y="444">2.04</text>
    </g>
    <g font-size="14" fill="#64748b" text-anchor="middle">
      <text x="200" y="482">0</text>
      <text x="275" y="482">15</text>
      <text x="350" y="482">30</text>
      <text x="425" y="482">45</text>
      <text x="500" y="482">60</text>
      <text x="630" y="482">0</text>
      <text x="705" y="482">4</text>
      <text x="780" y="482">8</text>
      <text x="855" y="482">12</text>
      <text x="930" y="482">16</text>
    </g>
    <rect x="40" y="517" width="920" height="67" rx="8" fill="#e2e8f0"/>
    <text x="60" y="545" font-size="18" font-weight="600">Both modes reclaimed approximately 58.7% of the starting footprint.</text>
    <text x="60" y="569" font-size="16">Concurrent mode ran longer; its extreme application tail was lower in both sequences.</text>
    <text x="40" y="614" font-size="14" fill="#475569">Requested workload: 250 TPS. Skipped load and throughput are reported in the post; p99 alone is not an availability measure.</text>
  </g>
</svg>
